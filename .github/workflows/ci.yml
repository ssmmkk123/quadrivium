name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and test dependencies
        env:
          QUADRIVIUM_REQUIRE_RUST: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # The compiled backend is built by the install above when a Rust
      # toolchain is present. Both paths are exercised: a wheel that silently
      # fell back to pure Python, or a fallback that has quietly rotted, are
      # both defects and both show up here.
      - name: Report which backend is active
        run: python -c "import quadrivium; print(quadrivium.accel.show_config()); assert quadrivium.accel.available()"

      - name: Run tests (compiled backend)
        run: python -m pytest -q

      - name: Run tests (pure-Python fallback)
        env:
          QUADRIVIUM_NO_ACCEL: "1"
        run: python -m pytest -q

  rust:
    name: Rust kernels
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path rust/Cargo.toml --release --all-targets -- -D warnings

      # The kernels are checked against the definitions they implement --
      # P A = L U, Q'Q = I, A V = V diag(lambda), the naive DFT -- so a
      # regression is caught here before it reaches the Python layer.
      - name: Test the kernels
        run: cargo test --manifest-path rust/Cargo.toml --release

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      # The reference pages are generated from the package; a stale page means
      # the documentation is describing an API that no longer exists.
      - name: Check the generated pages match the code
        run: python tools/gen_docs.py --check

      - name: Build the site
        run: python -m mkdocs build --strict

  package:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine "pytest>=7.0"
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "import quadrivium; print(quadrivium.__version__)"

      - name: Check the sdist carries the tests and can run them
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && python -m pytest -q
