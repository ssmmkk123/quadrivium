name: Bug report
description: Report reproducible incorrect behavior or a regression
title: "[Bug]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I can provide a minimal example that reproduces it.
          required: true

  - type: input
    id: version
    attributes:
      label: Quadrivium version
      placeholder: "1.2.0 or a commit hash"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Python, NumPy, and operating-system versions.
      placeholder: "Python 3.12, NumPy 2.2, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and why do you believe it is incorrect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Include an analytic result or independent reference when applicable.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Traceback or numerical output
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
