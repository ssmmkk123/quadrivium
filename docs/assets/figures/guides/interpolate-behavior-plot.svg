  <circle cx="820" cy="210" r="8" fill="#ea580c"/>
  <text x="120" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#475569">input scale / effort</text>
  <text x="18" y="224" transform="rotate(-90 18,224)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#475569">quality / stability</text>
