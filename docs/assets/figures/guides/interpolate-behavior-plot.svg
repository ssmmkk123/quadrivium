<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="interpolate representative behavior plot">
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="40" y="40" width="880" height="460" rx="18" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="40" width="880" height="78" rx="18" fill="#ea580c"/>
  <text x="70" y="88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="white">interpolate representative behavior plot</text>
  <text x="70" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#0f172a">Convergence, stability, or error trend for typical workloads</text>
  <line x1="110" y1="420" x2="850" y2="420" stroke="#94a3b8" stroke-width="3"/>
