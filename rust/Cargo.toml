[package]
name = "quadrivium-rs"
version = "1.2.0"
edition = "2021"
rust-version = "1.83"
description = "Compiled numerical kernels for the quadrivium Python library"
license = "MIT"
publish = false

[lib]
name = "_quadrivium_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Built against the running interpreter rather than the stable ABI: the buffer
# protocol, which is how arrays cross this boundary, only entered the limited
# API in 3.11, and the package's array core is version-specific in any case.
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.10"
num-complex = "0.4"
libm = "0.2.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
