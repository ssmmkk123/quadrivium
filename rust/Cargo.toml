[package]
name = "quadrivium-rs"
version = "1.2.0"
edition = "2021"
rust-version = "1.83"
description = "Compiled numerical kernels for the quadrivium Python library"
license = "MIT"
publish = false

[lib]
name = "_quadrivium_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"
rayon = "1.10"
num-complex = "0.4"
libm = "0.2.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
